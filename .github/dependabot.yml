# 424 (SEC-SC-05): every ecosystem the repo installs from, weekly, one grouped PR per ecosystem.
# The FROM lines in docker/ are pinned by digest in 426; this entry keeps those digests fresh.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    # The <4 / <2 caps are deliberate (425): a new major is a ticket, not a weekly bump.
    ignore:
      - dependency-name: fastmcp
        update-types: ["version-update:semver-major"]
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /adapters/typescript
    schedule:
      interval: weekly
    groups:
      npm-typescript-adapter:
        patterns: ["*"]
    # TypeScript 7 drops the JS compiler API this adapter parses with (SyntaxKind, readConfigFile).
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/node follows the Node 22 runtime CI uses; a newer major types APIs that runtime lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /adapters/sql
    schedule:
      interval: weekly
    groups:
      npm-sql-adapter:
        patterns: ["*"]
    ignore:
      # @types/node follows the Node 22 runtime CI uses; a newer major types APIs that runtime lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: composer
    directory: /adapters/php
    schedule:
      interval: weekly
    groups:
      composer:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    # The Python line is chosen with the CI matrix, not by a bot; digest refreshes still flow.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
