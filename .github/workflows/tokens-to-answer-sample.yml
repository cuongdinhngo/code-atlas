name: Tokens-to-answer (sample tier)

# Opt-in / scheduled only (task 042). The sample tier clones pinned public repos and needs PHP,
# so it is NOT a per-PR gate — the fixture gate in ci.yml stays that. See
# docs/runbooks/tokens-to-answer.md.

on:
  workflow_dispatch:
  schedule:
    # Weekly Monday 06:30 UTC (offset from cross-repo.yml's 06:00 to avoid clashing)
    - cron: "30 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sample-tier:
    name: tokens-to-answer sample tier (pinned SHAs)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The one write scope: the failure issue. No pull-request trigger reaches this file.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.28"
          python-version: "3.13"
          cache-dependency-glob: uv.lock

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          coverage: none

      - name: Composer (PHP adapter)
        run: composer install --no-interaction --no-progress --working-dir=adapters/php

      - name: Install code-atlas
        run: |
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Tokens-to-answer sample tier
        env:
          # Absolute path: adapter subprocess cwd is the sample root, not this repo.
          CA_PHP_CMD: php ${{ github.workspace }}/adapters/php/index.php --server
        run: |
          python scripts/tokens_to_answer.py --samples \
            --min-ratio 66 \
            --report-out artifacts/tokens-to-answer-sample-report.json \
            --markdown artifacts/tokens-to-answer-sample.md \
            --notice
          cat artifacts/tokens-to-answer-sample.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tokens-to-answer-sample-report
          path: artifacts/tokens-to-answer-sample-report.json
          if-no-files-found: warn

      - name: Open or comment failure issue
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'Tokens-to-answer sample tier failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Scheduled/opt-in tokens-to-answer sample tier failed on \`${context.ref}\`.`,
              '',
              `- Workflow run: ${runUrl}`,
              '- Download the `tokens-to-answer-sample-report` artifact for per-question rows.',
              '- A wrong answer or a ratio below the floor both fail it — see',
              '  `docs/runbooks/tokens-to-answer.md`.',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'tokens-to-answer-sample',
              per_page: 10,
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['tokens-to-answer-sample'],
              });
            }
