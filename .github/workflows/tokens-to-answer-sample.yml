name: Tokens-to-answer (sample tier)

# Opt-in / scheduled only (task 042). The sample tier clones pinned public repos and needs PHP,
# so it is NOT a per-PR gate — the fixture gate in ci.yml stays that. See
# docs/runbooks/tokens-to-answer.md.

on:
  workflow_dispatch:
  schedule:
    # Weekly Monday 06:30 UTC (offset from cross-repo.yml's 06:00 to avoid clashing)
    - cron: "30 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  sample-tier:
    name: tokens-to-answer sample tier (pinned SHAs)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Composer (PHP adapter)
        run: composer install --no-interaction --no-progress --working-dir=adapters/php

      - name: Install code-atlas
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Tokens-to-answer sample tier
        env:
          # Absolute path: adapter subprocess cwd is the sample root, not this repo.
          CA_PHP_CMD: php ${{ github.workspace }}/adapters/php/index.php --server
        run: |
          python scripts/tokens_to_answer.py --samples \
            --min-ratio 66 \
            --report-out artifacts/tokens-to-answer-sample-report.json \
            --markdown artifacts/tokens-to-answer-sample.md \
            --notice
          cat artifacts/tokens-to-answer-sample.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tokens-to-answer-sample-report
          path: artifacts/tokens-to-answer-sample-report.json
          if-no-files-found: warn

      - name: Open or comment failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Tokens-to-answer sample tier failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Scheduled/opt-in tokens-to-answer sample tier failed on \`${context.ref}\`.`,
              '',
              `- Workflow run: ${runUrl}`,
              '- Download the `tokens-to-answer-sample-report` artifact for per-question rows.',
              '- A wrong answer or a ratio below the floor both fail it — see',
              '  `docs/runbooks/tokens-to-answer.md`.',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'tokens-to-answer-sample',
              per_page: 10,
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['tokens-to-answer-sample'],
              });
            }
