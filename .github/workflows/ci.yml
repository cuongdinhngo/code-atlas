name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint · type · test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Least privilege: read the code, plus write the one sticky tokens-to-answer PR comment.
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        # The range pyproject.toml claims to support. Development happens on the newer one.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install check (non-editable package metadata)
        run: |
          python -m pip install --upgrade pip
          pip install .
          python -c "import importlib.metadata as m; assert m.version('code-atlas')"
          python -c "from code_atlas.main import TOOL_NAMES; assert 'search_symbol' in TOOL_NAMES"
          # Every declared console script, not just the server: a broken hook entry point (036, 053)
          # only surfaces when a user runs it, which is inside their git hook.
          python -c "import importlib.metadata as m; eps = m.entry_points(); scripts = eps.select(group='console_scripts') if hasattr(eps, 'select') else eps.get('console_scripts', []); names = {getattr(e, 'name', None) for e in scripts}; want = {'code-atlas', 'code-atlas-poke', 'code-atlas-refresh'}; assert want <= names, sorted(want - names)"

      - name: Install (editable + dev tools)
        run: |
          pip install -e ".[dev]"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - uses: actions/cache@v4
        with:
          path: adapters/php/vendor
          key: composer-${{ hashFiles('adapters/php/composer.lock') }}

      - name: Install the PHP adapter's own runtime deps
        run: composer install --no-dev --no-interaction --no-progress --working-dir=adapters/php

      # No `if:` guards below. They existed while these directories were empty; today their only
      # effect would be to skip the check and pass green when the directory goes missing.
      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy code_atlas

      - name: Tests (pytest — unit · contract · integration)
        run: pytest -q

      # Tokens-to-answer gate (task 034 / 055): fails on a wrong answer, a ratio regression, or a
      # recall miss. The ratio floor is a behavior-lock; the recall floor is the correctness gate.
      # One interpreter is enough — a token count does not vary by Python version.
      - name: Tokens-to-answer benchmark (ratio + recall regression gate)
        if: matrix.python-version == '3.13'
        env:
          CA_PHP_CMD: php ${{ github.workspace }}/adapters/php/index.php --server
        run: |
          status=0
          python scripts/tokens_to_answer.py --min-ratio 0.27 --min-recall 1.0 \
            --markdown "${RUNNER_TEMP}/tokens-to-answer.md" --notice || status=$?
          if [ -f "${RUNNER_TEMP}/tokens-to-answer.md" ]; then
            cat "${RUNNER_TEMP}/tokens-to-answer.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      # Sticky: find this workflow's own comment by its marker and edit it, so a 20-push PR keeps
      # one comment. A fork PR gets a read-only token, hence continue-on-error.
      - name: Comment the ratio on the pull request
        if: always() && matrix.python-version == '3.13' && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: ${{ runner.temp }}/tokens-to-answer.md
          PR: ${{ github.event.number }}
        run: |
          [ -f "$BODY" ] || { echo "no report to comment"; exit 0; }
          marker=$(python -c "import sys; sys.path.insert(0, 'scripts'); \
            import tokens_to_answer as t; print(t.COMMENT_MARKER)")
          jq -Rs '{body: .}' < "$BODY" > "${RUNNER_TEMP}/comment.json"
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"${marker}\")) | .id] | first // empty")
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" \
              --input "${RUNNER_TEMP}/comment.json" --jq .html_url
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
              --input "${RUNNER_TEMP}/comment.json" --jq .html_url
          fi

      - name: Upload the tokens-to-answer report
        if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: tokens-to-answer-report
          path: artifacts/tokens-to-answer-report.json
          if-no-files-found: warn

  adapters:
    name: adapter manifests · syntax · static analysis
    runs-on: ubuntu-latest
    # Least privilege: this job only reads the tree.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: R8.3 — composer.json and the committed lock agree
        run: composer validate --strict --no-check-publish --working-dir=adapters/php

      - name: PHP syntax check, authored source only (R6.5)
        run: |
          count=$(find adapters -path '*/vendor' -prune -o -name '*.php' -print | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::no authored adapter source found — this check would pass vacuously"
            exit 1
          fi
          find adapters -path '*/vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
          echo "php -l ok on $count file(s)"

      # Its own cache key: this job needs the dev tools, the test job installs runtime deps only.
      - uses: actions/cache@v4
        with:
          path: adapters/php/vendor
          key: composer-dev-${{ hashFiles('adapters/php/composer.lock') }}

      - name: Install the PHP adapter's deps, dev tools included
        run: composer install --no-interaction --no-progress --working-dir=adapters/php

      - name: Static analysis (phpstan, level max) — the adapter's mypy (R6.6)
        run: adapters/php/vendor/bin/phpstan analyse --no-progress --configuration=adapters/php/phpstan.neon

  guardrails:
    name: rulebook grep-gates
    runs-on: ubuntu-latest
    # Least privilege: the gates read source and commit messages, nothing else.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # R7.3 compares the PR's commit range, which a shallow clone cannot see.
          fetch-depth: 0

      - name: R1.1 — no language branches in the core
        run: |
          if [ ! -d code_atlas ]; then
            echo "::error::R1.1 — code_atlas/ is missing; this gate cannot pass vacuously"
            exit 1
          fi
          if grep -rEn 'if[^\n]*\blanguage\b[^\n]*==|match[^\n]*\blanguage\b' code_atlas/; then
            echo "::error::R1.1 — language branch found in core (fix the contract, not the core)"
            exit 1
          fi
          echo "R1.1 ok"

      - name: R2.2 — no repo/framework names in adapter source
        run: |
          # Authored source only: Composer's own autoloader documents itself with a Symfony
          # example, so an unscoped grep fails on a dependency nobody here wrote.
          # Denylist grows as frameworks are added; the authoritative gate lands with task 012.
          if [ ! -d adapters ]; then
            echo "::error::R2.2 — adapters/ is missing; this gate cannot pass vacuously"
            exit 1
          fi
          if grep -rEin --exclude-dir=vendor --exclude-dir=node_modules \
               'laravel|symfony|wordpress|drupal|magento' adapters/; then
            echo "::error::R2.2 — repo/framework name found in adapter source"
            exit 1
          fi
          # Task 113 put a path-shape classifier in the core, so the gate must cover it too. Scoped
          # to code_atlas/: scripts/ and tests/ legitimately name the pinned public repos (R2.3).
          if grep -rEin 'laravel|symfony|wordpress|drupal|magento' code_atlas/; then
            echo "::error::R2.2 — repo/framework name found in core source"
            exit 1
          fi
          echo "R2.2 ok"

      - name: R7.3 — no co-author or AI-attribution trailer
        if: github.event_name == 'pull_request'
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: |
          count=$(git rev-list --count "$RANGE")
          if [ "$count" -eq 0 ]; then
            echo "::error::R7.3 — empty commit range; this gate would pass vacuously"
            exit 1
          fi
          if git log --format='%B' "$RANGE" \
               | grep -Ein 'co-authored-by:|generated with|🤖'; then
            echo "::error::R7.3 — co-author / AI-attribution trailer found in a commit message"
            exit 1
          fi
          echo "R7.3 ok over $count commit(s)"
