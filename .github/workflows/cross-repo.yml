name: Cross-repo validation

# Opt-in / scheduled only (task 018, R6.2, R6.3). Never a per-PR gate — see ci.yml.

on:
  workflow_dispatch:
  schedule:
    # Weekly Monday 06:00 UTC
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  public-samples:
    name: public samples (pinned SHAs)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The one write scope: the failure issue. No pull-request trigger reaches this file.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.28"
          python-version: "3.12"
          cache-dependency-glob: uv.lock

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          coverage: none

      - name: Composer (PHP adapter)
        run: composer install --no-interaction --no-progress --working-dir=adapters/php

      # The manifest carries `typescript` samples too (task 150). The TS adapter requires
      # `typescript` at startup, so without these it exits 1 before announcing itself.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: npm ci (TypeScript adapter)
        run: npm ci --prefix adapters/typescript

      - name: npm ci (SQL adapter)
        run: npm ci --prefix adapters/sql

      - name: Install code-atlas
        run: |
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Cross-repo validate (public only)
        env:
          # Absolute paths: adapter subprocess cwd is the sample root, not this repo.
          CA_PHP_CMD: php ${{ github.workspace }}/adapters/php/index.php --server
          CA_TYPESCRIPT_CMD: node ${{ github.workspace }}/adapters/typescript/index.js --server
          CA_PYTHON_CMD: python ${{ github.workspace }}/adapters/python/index.py --server
          CA_SQL_CMD: node ${{ github.workspace }}/adapters/sql/index.js --server
        run: python scripts/cross_repo_validate.py --public-only

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cross-repo-report
          path: artifacts/cross-repo-report.json
          if-no-files-found: warn

      - name: Open or comment failure issue
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const title = 'Cross-repo validation failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Scheduled/opt-in cross-repo validation failed on \`${context.ref}\`.`,
              '',
              `- Workflow run: ${runUrl}`,
              '- Download the `cross-repo-report` artifact for per-sample `ok` / `error` rows.',
              '- See `docs/runbooks/cross-repo-validation.md`.',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'cross-repo-validation',
              per_page: 10,
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['cross-repo-validation'],
              });
            }
