name: CodeQL

# Analysis only (424, SEC-SC-08). Push to main and a weekly run, never `pull_request`: its
# `security-events: write` then sits in a job that runs no pull-request code (SEC-SC-02).
# No scripts/gate.sh counterpart: the scan needs GitHub's CodeQL service and uploads to code scanning.

on:
  push:
    branches:
      - main
  schedule:
    # Weekly Tuesday 05:17 UTC
    - cron: "17 5 * * 2"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialise CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyse with CodeQL
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
