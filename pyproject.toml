[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-atlas"
version = "0.1.0"
description = "Local-first MCP server that indexes a codebase into SQLite and exposes token-efficient search/read/navigation/impact tools."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["fastmcp>=3,<4"]
classifiers = ["License :: OSI Approved :: MIT License"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
code-atlas = "code_atlas.main:main"
code-atlas-poke = "code_atlas.hooks.poke:main"

[tool.setuptools.packages.find]
include = ["code_atlas*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["code_atlas"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
