[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-atlas"
version = "0.2.0"
description = "Local-first MCP server that indexes a codebase into SQLite and exposes token-efficient search/read/navigation/impact tools."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["fastmcp>=3,<4"]
classifiers = ["License :: OSI Approved :: MIT License"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]
# Opt-in LLM summarizer (task 090); never required by the core or the CI gate (R4.1). Floor is
# recent enough to resolve current Claude model ids (Sonnet 5 / Opus 5 era); latest at write is 0.122.
llm = ["anthropic>=0.69"]

[project.scripts]
code-atlas = "code_atlas.main:main"
code-atlas-build = "code_atlas.cli:main"
code-atlas-llm = "onboarding_llm.server:run"
code-atlas-nudge = "code_atlas.hooks.nudge:main"
code-atlas-poke = "code_atlas.hooks.poke:main"
code-atlas-refresh = "code_atlas.hooks.refresh:main"
code-atlas-signal = "code_atlas.hooks.signal:main"
code-atlas-state = "code_atlas.hooks.state:main"

[tool.setuptools.packages.find]
include = ["code_atlas*", "onboarding_llm*"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Adapter #4 is the first written in this repo's own language, so its fixture corpus is the
# first the core's linter can see. Those files are parser INPUT — unused imports, unsorted
# blocks and one unparseable file are the cases under test, not defects (020).
extend-exclude = ["tests/fixtures/python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["code_atlas", "onboarding_llm"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
